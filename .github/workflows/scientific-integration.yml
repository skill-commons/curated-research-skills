name: Scientific integration

on:
  pull_request:
    paths:
      - ".github/workflows/scientific-integration.yml"
      - "skills/jubik-bootstrap/**"
      - "skills/nifty-re-variational-inference/**"
      - "tests/test_jubik_bootstrap.py"
      - "tests/test_nifty_re_variational_inference.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/scientific-integration.yml"
      - "skills/jubik-bootstrap/**"
      - "skills/nifty-re-variational-inference/**"
      - "tests/test_jubik_bootstrap.py"
      - "tests/test_nifty_re_variational_inference.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-integration:
    name: Pinned CPU scientific integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.10.12"
          enable-cache: false

      - name: Prepare private integration directories and tools
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          INTEGRATION_ROOT="$RUNNER_TEMP/crs-scientific-integration"
          export INTEGRATION_ROOT
          printf 'INTEGRATION_ROOT=%s\n' "$INTEGRATION_ROOT" >> "$GITHUB_ENV"
          mkdir -p \
            "$INTEGRATION_ROOT/home" \
            "$INTEGRATION_ROOT/tmp" \
            "$INTEGRATION_ROOT/tools" \
            "$INTEGRATION_ROOT/uv-cache" \
            "$INTEGRATION_ROOT/reports"
          chmod 700 "$INTEGRATION_ROOT" "$INTEGRATION_ROOT"/*
          install -m 0700 "$(command -v uv)" "$INTEGRATION_ROOT/tools/uv"
          test -x /usr/bin/python3.12
          /usr/bin/python3.12 -I -B -c \
            'import platform, sys; assert platform.system() == "Linux"; assert platform.machine() == "x86_64"; assert sys.version_info[:2] == (3, 12)'
          "$INTEGRATION_ROOT/tools/uv" --version

      - name: Install and certify NIFTy.re on CPU
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PYTHON_BIN=/usr/bin/python3.12
          UV_BIN="$INTEGRATION_ROOT/tools/uv"
          CLEAN_PATH="$INTEGRATION_ROOT/tools:/usr/bin:/bin"
          NIFTY_PROJECT="$GITHUB_WORKSPACE/skills/nifty-re-variational-inference/assets/nifty-re-certification-environment"
          NIFTY_ENV="$INTEGRATION_ROOT/nifty-re-environment"
          NIFTY_CACHE="$INTEGRATION_ROOT/nifty-re-certification-cache"
          NIFTY_REPORT="$INTEGRATION_ROOT/reports/nifty-re-certification.json"
          NIFTY_SCRIPT="$GITHUB_WORKSPACE/skills/nifty-re-variational-inference/scripts/nifty_re_linear_gaussian.py"

          test -f "$NIFTY_PROJECT/pyproject.toml"
          test -f "$NIFTY_PROJECT/uv.lock"
          test -f "$NIFTY_SCRIPT"

          env -i \
            PATH="$CLEAN_PATH" \
            HOME="$INTEGRATION_ROOT/home" \
            TMPDIR="$INTEGRATION_ROOT/tmp" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            UV_CACHE_DIR="$INTEGRATION_ROOT/uv-cache" \
            UV_PROJECT_ENVIRONMENT="$NIFTY_ENV" \
            /usr/bin/timeout --signal=TERM --kill-after=30s 8m \
              "$UV_BIN" sync \
              --project "$NIFTY_PROJECT" \
              --python "$PYTHON_BIN" \
              --frozen \
              --no-build \
              --no-dev \
              --no-install-project \
              --default-index https://pypi.org/simple \
              --index-strategy first-index \
              --keyring-provider disabled \
              --no-python-downloads \
              --link-mode copy \
              --no-progress \
              --no-config

          env -i \
            PATH="$CLEAN_PATH" \
            HOME="$INTEGRATION_ROOT/home" \
            TMPDIR="$INTEGRATION_ROOT/tmp" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            UV_CACHE_DIR="$INTEGRATION_ROOT/uv-cache" \
            UV_PROJECT_ENVIRONMENT="$NIFTY_ENV" \
            "$UV_BIN" sync \
              --check \
              --offline \
              --project "$NIFTY_PROJECT" \
              --python "$PYTHON_BIN" \
              --frozen \
              --no-build \
              --no-dev \
              --no-install-project \
              --no-python-downloads \
              --no-progress \
              --no-config

          env -i \
            PATH="$CLEAN_PATH" \
            HOME="$INTEGRATION_ROOT/home" \
            TMPDIR="$INTEGRATION_ROOT/tmp" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            UV_CACHE_DIR="$INTEGRATION_ROOT/uv-cache" \
            "$UV_BIN" pip check \
              --python "$NIFTY_ENV/bin/python" \
              --no-config

          env -i \
            HOME="$INTEGRATION_ROOT/home" \
            TMPDIR="$INTEGRATION_ROOT/tmp" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            /usr/bin/timeout --signal=TERM --kill-after=30s 6m \
              "$NIFTY_ENV/bin/python" -I -B "$NIFTY_SCRIPT" \
                --output "$NIFTY_REPORT" \
                --cache-dir "$NIFTY_CACHE"

          env -i PATH="$CLEAN_PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$NIFTY_ENV/bin/python" -I -B "$NIFTY_SCRIPT" --verify-report "$NIFTY_REPORT"

          env -i PATH="$CLEAN_PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$PYTHON_BIN" -I -B -c \
              'import hashlib, json, sys; value=json.load(open(sys.argv[1], encoding="utf-8")); claimed=value.pop("canonical_payload_sha256"); observed=hashlib.sha256(json.dumps(value, ensure_ascii=False, allow_nan=False, sort_keys=True, separators=(",", ":")).encode()).hexdigest(); assert claimed == observed; assert value["schema_version"] == 2; assert value["validation_passed"] is True; assert value["scientific_conclusion_ready"] is False; assert all(value["checks"].values())' \
              "$NIFTY_REPORT"

      - name: Bootstrap and smoke-test J-UBIK core on CPU
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          PYTHON_BIN=/usr/bin/python3.12
          UV_BIN="$INTEGRATION_ROOT/tools/uv"
          CLEAN_PATH="$INTEGRATION_ROOT/tools:/usr/bin:/bin"
          JUBIK_PROJECT="$GITHUB_WORKSPACE/skills/jubik-bootstrap/assets/jubik-core-environment"
          JUBIK_BOOTSTRAP="$GITHUB_WORKSPACE/skills/jubik-bootstrap/scripts/jubik_bootstrap.py"
          JUBIK_ENV="$INTEGRATION_ROOT/jubik-core-environment"
          JUBIK_DOCTOR="$INTEGRATION_ROOT/reports/jubik-doctor.json"
          JUBIK_PLAN="$INTEGRATION_ROOT/reports/jubik-plan.json"
          JUBIK_PLAN_STDOUT="$INTEGRATION_ROOT/reports/jubik-plan-stdout.json"
          JUBIK_RESULT="$INTEGRATION_ROOT/reports/jubik-create.json"

          test -f "$JUBIK_PROJECT/pyproject.toml"
          test -f "$JUBIK_PROJECT/uv.lock"
          test -f "$JUBIK_BOOTSTRAP"

          env -i \
            PATH="$CLEAN_PATH" \
            HOME="$INTEGRATION_ROOT/home" \
            TMPDIR="$INTEGRATION_ROOT/tmp" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            "$PYTHON_BIN" -I -B "$JUBIK_BOOTSTRAP" doctor \
              --python "$PYTHON_BIN" \
              --uv "$UV_BIN" | tee "$JUBIK_DOCTOR"

          env -i \
            PATH="$CLEAN_PATH" \
            HOME="$INTEGRATION_ROOT/home" \
            TMPDIR="$INTEGRATION_ROOT/tmp" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            "$PYTHON_BIN" -I -B "$JUBIK_BOOTSTRAP" plan \
              --environment "$JUBIK_ENV" \
              --output "$JUBIK_PLAN" \
              --python "$PYTHON_BIN" \
              --uv "$UV_BIN" > "$JUBIK_PLAN_STDOUT"

          PLAN_SHA="$(
            env -i PATH="$CLEAN_PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
              "$PYTHON_BIN" -I -B -c \
                'import json, sys; plan=json.load(open(sys.argv[1], encoding="utf-8")); stdout=json.load(open(sys.argv[2], encoding="utf-8")); assert plan == stdout; command=plan["commands"]["sync"]; assert "--frozen" in command; assert "--no-build" in command; assert "--no-cache" in command; assert "--no-config" in command; print(plan["plan_sha256"])' \
                "$JUBIK_PLAN" "$JUBIK_PLAN_STDOUT"
          )"

          env -i \
            PATH="$CLEAN_PATH" \
            HOME="$INTEGRATION_ROOT/home" \
            TMPDIR="$INTEGRATION_ROOT/tmp" \
            LANG=C.UTF-8 \
            LC_ALL=C.UTF-8 \
            /usr/bin/timeout --signal=TERM --kill-after=30s 15m \
              "$PYTHON_BIN" -I -B "$JUBIK_BOOTSTRAP" create \
                --plan "$JUBIK_PLAN" \
                --confirm "$PLAN_SHA" > "$JUBIK_RESULT"

          env -i PATH="$CLEAN_PATH" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            "$PYTHON_BIN" -I -B -c \
              'import json, sys; from pathlib import Path; value=json.load(open(sys.argv[1], encoding="utf-8")); assert value["schema_version"] == 2; assert value["status"] == "core_ready"; assert value["scientific_research_ready"] is False; assert not any(value["adapters"].values()); assert all(Path(value[key]).is_dir() for key in ("environment", "cache_root", "provenance_assets")); assert all(Path(value[key]).is_file() for key in ("report", "state")); report=json.load(open(value["report"], encoding="utf-8")); assert report["schema_version"] == 2; assert report["core_ready"] is True; assert report["scientific_research_ready"] is False; assert all(report["checks"].values())' \
              "$JUBIK_RESULT"
