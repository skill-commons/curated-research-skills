[project]
name = "curated-research-skills"
version = "0.1.0"
description = "Hermes-native research skills maintained by Skill Commons"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["skills"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
